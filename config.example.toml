# ODIN config. Copy to config.toml and point ODIN_CONFIG at it.
#
# Deployment values are NOT in here. Phone number, API URL and paths come from env vars:
# SIGNAL_NUMBER, SIGNAL_API_URL (default http://localhost:8080), ODIN_CONFIG, ODIN_DB. The group
# IDs are stored in the database by `odin setup`; FLAT_GROUP_ID / DINNER_GROUP_ID env vars
# override them when set.
#
# Every value below is the default, except the templates, which have no defaults.

timezone = "Europe/Berlin"

# The reaction that counts: flatmates confirming dinner, guests saying they come.
emoji = "👍"

# How late a missed action (bot was down) may still be performed: "until_dinner" (until dinner
# starts) or a number of minutes after its scheduled time.
catch_up_grace = "until_dinner"

# Weekly cycle. weekday: mon … sun (or monday … sunday); time: "HH:MM", in `timezone`.
# All points belong to the week that ends with `dinner` and must follow this order.
[schedule]
# Ask the flat group whether dinner takes place.
flat_ask = { weekday = "tue", time = "18:00" }
# Remind the flat group if nobody has confirmed yet. Set enabled = false to turn it off.
nudge = { weekday = "wed", time = "12:00", enabled = true }
# Confirmations close; the dinner group gets the announcement or the cancellation.
flat_deadline = { weekday = "wed", time = "18:00" }
# Guests are asked to react by then (we order food then); later reactions are fine.
rsvp_by = { weekday = "fri", time = "14:00" }
# Tell the flat group how many guests reacted.
tally = { weekday = "fri", time = "14:00" }
# Optional: come early and help cook.
cook = { weekday = "sun", time = "17:00" }
dinner = { weekday = "sun", time = "18:00" }

# ODIN's Signal profile, applied by `odin setup`.
[profile]
name = "Odin 🍽️"
# Optional profile picture (PNG or JPEG). A relative path is resolved against this file's
# directory, e.g. avatar = "odin.png" next to config.toml.
# avatar = "odin.png"
# Optional about text, shown under the name. Leave it out to keep what Signal has; "" clears it.
# about = "Ich organisiere das Sonntagsessen · I organise the Sunday dinner"

# Message texts. Placeholders, in every template unless noted:
#   {emoji}
#   {deadline} {rsvp_by} {cook_time} {dinner_time}   — times from [schedule], as HH:MM
#                                                      (deadline = flat_deadline, cook_time = cook)
#   {deadline_day_de} {rsvp_by_day_de} {cook_day_de} {dinner_day_de}
#                                                    — their weekdays in German: Mittwoch, …
#   {deadline_day_en} {rsvp_by_day_en} {cook_day_en} {dinner_day_en}
#                                                    — their weekdays in English: Wednesday, …
#   {count}                                          — tally only
# Unknown placeholders are rejected at startup. Write {{ and }} for literal braces.
# Use the weekday placeholders instead of writing weekday names, so the texts stay right when
# the schedule changes.
# Flat-group texts are German; dinner-group texts are German, blank line, English.
# hello and flat_test are only sent by `odin setup`.
[templates]
flat_ask = """
Findet am {dinner_day_de} das offene Abendessen statt? 🍽️
Wer da ist und das Abendessen ausrichtet, reagiert bitte bis {deadline_day_de} {deadline} mit \
{emoji} auf diese Nachricht. Ein {emoji} reicht – ohne {emoji} sage ich das Abendessen am \
{deadline_day_de} um {deadline} ab.
"""

nudge = """
Bisher hat noch niemand mit {emoji} bestätigt, dass das Abendessen am {dinner_day_de} \
stattfindet. Wenn bis {deadline_day_de} {deadline} kein {emoji} auf meine Frage kommt, sage \
ich es ab.
"""

cancellation = """
Diesen {dinner_day_de} findet leider kein offenes Abendessen statt. Bis zum nächsten Mal!

Unfortunately, there is no open dinner this {dinner_day_en}. See you next time!
"""

announcement = """
Diesen {dinner_day_de} gibt es offenes Abendessen! 🍽️
Essen gibt es um {dinner_time}. Wer mag, kann schon um {cook_time} kommen und beim Kochen \
helfen – das ist völlig freiwillig und überhaupt keine Voraussetzung.
Wenn du kommst, reagiere bitte mit {emoji} auf diese Nachricht, am besten bis \
{rsvp_by_day_de} {rsvp_by} – dann bestellen wir das Essen. Bringst du jemanden mit? Dann \
schreib das bitte als Antwort auf diese Nachricht.

Open dinner this {dinner_day_en}! 🍽️
Dinner is at {dinner_time}. If you like, come at {cook_time} and help cook – that is entirely \
optional and absolutely no requirement.
If you are coming, please react with {emoji} to this message, ideally by {rsvp_by_day_en} \
{rsvp_by} – that is when we order the food. Bringing someone? Please say so in a reply to this \
message.
"""

tally = """
Bisher haben {count} Personen mit {emoji} auf die Ankündigung reagiert. Plus-Ones stehen \
gegebenenfalls in den Antworten darauf.
"""

# Direct message to the operator during `odin setup`. They reply to it, so that ODIN gets their
# profile key (without it, ODIN ends up only "invited" to groups the operator adds it to).
hello = """
Hallo, hier ist Odin 🍽️! Bitte antworte kurz auf diese Nachricht, damit die Einrichtung \
weitergehen kann.
"""

# Optional test message to the flat group at the end of `odin setup`.
flat_test = """
Hallo, ich bin Odin 🍽️! Ab jetzt frage ich jeden Dienstag, ob am {dinner_day_de} das \
offene Abendessen stattfindet. Bestätigt wird mit {emoji}.
"""
