name: Image

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/emrys-merlin/odib

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      # podman ships with the ubuntu runner; building with it is the same path as on the homelab.
      - name: Build
        run: podman build -f Containerfile -t "$IMAGE:latest" -t "$IMAGE:$GITHUB_SHA" .
      - name: Smoke test
        run: podman run --rm "$IMAGE:$GITHUB_SHA" --help
      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          podman push "$IMAGE:$GITHUB_SHA"
          podman push "$IMAGE:latest"
