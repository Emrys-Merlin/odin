[project]
name = "odib"
version = "0.1.0"
description = "ODIN — Open Dinner Invitation Notifier: a Signal bot for our weekly open Sunday dinner"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tim Adler" }]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "tzdata>=2026.5",
    "websockets>=17.2",
]

[project.scripts]
odib = "odib:main"

[dependency-groups]
dev = [
    "prek>=0.5.4",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
