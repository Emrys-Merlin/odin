[project]
name = "odib"
dynamic = ["version"]
description = "ODIN — Open Dinner Invitation Notifier: a Signal bot for our weekly open Sunday dinner"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tim Adler" }]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "tzdata>=2026.5",
    "websockets>=17.2",
]

[project.scripts]
odib = "odib:main"

[dependency-groups]
dev = [
    "prek>=0.5.4",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

# The version comes from the latest `vX.Y.Z` git tag (see .github/workflows/release.yml). Without
# git (container build) it comes from SETUPTOOLS_SCM_PRETEND_VERSION_FOR_ODIB.
[tool.hatch.version]
source = "vcs"
# Lets setuptools-scm match the per-package SETUPTOOLS_SCM_PRETEND_VERSION_FOR_ODIB.
raw-options = { dist_name = "odib" }

[tool.uv]
# Rebuild the project when a commit or tag changes the version, not only when pyproject.toml does.
cache-keys = [
    { file = "pyproject.toml" },
    { git = { commit = true, tags = true } },
    { env = "SETUPTOOLS_SCM_PRETEND_VERSION_FOR_ODIB" },
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
